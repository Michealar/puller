<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SecFeed</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#8b949e;--ac:#3fb950;--bd:#30363d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 12px 6px;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:18px;margin:0;flex:1}h1 span{color:var(--ac)}
button,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
input{width:100%;margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:99px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--ac);color:#000;border-color:var(--ac)}
main{padding:10px 12px calc(30px + env(safe-area-inset-bottom))}
a.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;color:inherit;text-decoration:none}
a.card.seen .t{color:var(--mu)}
.m{font-size:12px;color:var(--mu);display:flex;justify-content:space-between;gap:8px}
.m b{color:var(--ac);font-weight:600}
.t{font-weight:600;margin:4px 0}
.d{font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#st{text-align:center;color:var(--mu);font-size:13px;padding:8px}
</style></head><body>
<header>
<div class="row"><h1>Sec<span>Feed</span></h1><button id="rf">↻ Refresh</button></div>
<input id="q" type="search" placeholder="Search headlines…">
<div class="chips" id="chips"></div>
</header>
<main><div id="st">Loading…</div><div id="list"></div></main>
<script>
const FEEDS=[
{n:"SANS ISC",u:"https://isc.sans.edu/rssfeed.xml"},
{n:"Huntress",u:"https://www.huntress.com/blog/rss.xml"},
{n:"Group-IB",u:"https://www.group-ib.com/blog/feed/"},
{n:"Microsoft Security",u:"https://www.microsoft.com/en-us/security/blog/feed/"},
{n:"SecurityWeek",u:"https://feeds.feedburner.com/securityweek"},
{n:"The Hacker News",u:"https://feeds.feedburner.com/TheHackersNews"},
{n:"Daniel Miessler",u:"https://danielmiessler.com/feed"},
{n:"Graham Cluley",u:"https://grahamcluley.com/feed/"},
{n:"Schneier",u:"https://www.schneier.com/feed/atom/"},
{n:"Krebs",u:"https://krebsonsecurity.com/feed/"}];
const PROXIES=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u)];
const $=s=>document.querySelector(s);
let items=JSON.parse(localStorage.getItem("items")||"[]"),filter="All",seen=new Set(JSON.parse(localStorage.getItem("seen")||"[]"));
const strip=h=>{const d=document.createElement("div");d.innerHTML=h||"";return(d.textContent||"").trim().slice(0,300)};
const txt=(e,s)=>{const n=e.querySelector(s);return n?n.textContent:""};
function parse(xml,name){
 const doc=new DOMParser().parseFromString(xml,"text/xml");
 return[...doc.querySelectorAll("item,entry")].slice(0,25).map(e=>{
  const l=e.querySelector("link");
  const link=l?(l.getAttribute("href")||l.textContent).trim():"";
  const date=new Date(txt(e,"pubDate")||txt(e,"published")||txt(e,"updated")||txt(e,"date")).getTime()||0;
  return{src:name,title:strip(txt(e,"title")),link,date,desc:strip(txt(e,"description")||txt(e,"summary")||txt(e,"content"))};
 }).filter(i=>i.link);
}
async function load(f){
 for(const p of PROXIES){
  try{const r=await fetch(p(f.u));if(!r.ok)continue;const t=await r.text();const o=parse(t,f.n);if(o.length)return o}catch(e){}
 }
 try{const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f.u));const j=await r.json();
  return(j.items||[]).map(i=>({src:f.n,title:strip(i.title),link:i.link,date:new Date(i.pubDate.replace(" ","T")+"Z").getTime()||0,desc:strip(i.description)}))}catch(e){}
 return[];
}
async function refresh(){
 $("#st").textContent="Fetching "+FEEDS.length+" sources…";$("#rf").disabled=true;
 const res=await Promise.all(FEEDS.map(load));
 const fresh=res.flat();
 const failed=FEEDS.filter((f,i)=>!res[i].length).map(f=>f.n);
 const okNames=new Set(fresh.map(i=>i.src));
 items=[...fresh,...items.filter(i=>!okNames.has(i.src))].sort((a,b)=>b.date-a.date);
 localStorage.setItem("items",JSON.stringify(items.slice(0,400)));
 $("#st").textContent=failed.length?"Couldn't load: "+failed.join(", "):"Updated "+new Date().toLocaleTimeString();
 $("#rf").disabled=false;render();
}
function render(){
 const q=$("#q").value.toLowerCase();
 $("#chips").innerHTML=["All",...FEEDS.map(f=>f.n)].map(n=>`<button class="chip ${n==filter?"on":""}" data-n="${n}">${n}</button>`).join("");
 $("#list").innerHTML=items.filter(i=>(filter=="All"||i.src==filter)&&(!q||(i.title+i.desc).toLowerCase().includes(q))).map(i=>
 `<a class="card ${seen.has(i.link)?"seen":""}" href="${i.link}" target="_blank" rel="noopener" data-l="${i.link}"><div class="m"><b>${i.src}</b><span>${i.date?new Date(i.date).toLocaleDateString(undefined,{month:"short",day:"numeric"}):""}</span></div><div class="t"></div><div class="d"></div></a>`).join("");
 const vis=items.filter(i=>(filter=="All"||i.src==filter)&&(!q||(i.title+i.desc).toLowerCase().includes(q)));
 document.querySelectorAll("#list .card").forEach((c,k)=>{c.querySelector(".t").textContent=vis[k].title;c.querySelector(".d").textContent=vis[k].desc});
}
$("#chips").onclick=e=>{if(e.target.dataset.n){filter=e.target.dataset.n;render()}};
$("#list").onclick=e=>{const c=e.target.closest(".card");if(c){seen.add(c.dataset.l);localStorage.setItem("seen",JSON.stringify([...seen]));c.classList.add("seen")}};
$("#q").oninput=render;$("#rf").onclick=refresh;
render();refresh();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
